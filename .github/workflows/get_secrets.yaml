name: Get Secrets
on:
  workflow_dispatch:

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: get secrets
        run: |
          EE_LIST=$(echo "${{ secrets.* }}" | grep "EE_")
          for ee_name in $EE_LIST; do
            echo "ee_name=$ee_name"
            value="${{ secrets[$ee_name] }}"
            export "$ee_name=$value"
          done