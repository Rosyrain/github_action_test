name: Template Test
on:
  workflow_dispatch:

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        id: s1
        run: |
          echo "Step 1 running."
          exit 1

      - name: Step 2
        id: s2
        run: echo "Step 2 running."

      - name: Check Failures
        if: ${{ steps.s1.status == 'failure' || steps.s2.status == 'failure' }}
        run: echo "s1:${{ steps.s1.status }},s2:${{ steps.s2.status }}"