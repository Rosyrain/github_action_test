name: Template Test
on:
  workflow_dispatch:

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        id: s1
        run: |
          echo "Step 1 running."
          exit 1

      - name: Step 2
        #if: ${{ always() }}
        id: s2
        run: echo "Step 2 running."

      - name: Step 3
        if: ${{ always() }}
        id: s3
        run: echo "Step 3 running."

      - name: Step 4
        id: s4
        if: ${{ steps.s1.conclusion == 'failure' }}
        run: echo "Step4 running."

      - name: Check Failures
        if: ${{ always() && !cancelled() }}
        run: echo "s1:${{ steps.s1.conclusion }},s2:${{ steps.s2.conclusion }},s3:${{ steps.s3.conclusion }}"