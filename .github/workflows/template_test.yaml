name: Template Test
on:
  workflow_dispatch:

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        id: s1
        run: |
          echo "Step 1 running."
          exit 1

      - name: Step 2
        #if: ${{ always() }}
        id: s2
        run: echo "Step 2 running."

      - name: Check Failures
        if: ${{ always() && !cancelled() && (steps.s1.conclusion == 'failure' || steps.s2.conclusion == 'failure') }}
        run: echo "s1:${{ steps.s1.conclusion }},s2:${{ steps.s2.conclusion }}"